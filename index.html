<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSS Style -->
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css"
    />
    <title>Admin Dashboard</title>
  </head>
  <body>
    <div class="main-layout">
      <nav class="sidebar">
        <div class="nav-gird">
          <div class="dash-icon">
            <i class="mdi mdi-view-dashboard"></i>
          </div>
          <div class="dash-titles justify">
            <p>Dashboard</p>
          </div>

          <div class="pages item">
            <i class="mdi mdi-home "></i>
            <p>Home</p>
            <i class="mdi mdi-card-account-details-outline"></i>
            <p>Profile</p>
            <i class="mdi mdi-message"></i>
            <p>Messages</p>

            <i class="mdi mdi-clock-time-three"></i>
            <p>History</p>

            <i class="mdi mdi-note-multiple"></i>
            <p>Tasks</p>

            <i class="mdi mdi-account-group"></i>
            <p>communities</p>
          </div>
          <div class="manage item manage-item">
            <i class="mdi mdi-cog" style="font-size: 24px"></i>
            <p>Settings</p>
            <i class="mdi mdi-help-box" style="font-size: 24px"></i>
            <p>Support</p>
            <i class="mdi mdi-shield-check"></i>
            <p>Privacy</p>
          </div>
        </div>
      </nav>
      <header class="topbar">
        <div class="search-area">
            <i class="mdi mdi-magnify"></i>
            <input type="text" placeholder="Search..." />
        </div>
        <div class="profile-area">
            <i class="mdi mdi-bell-ring-outline"></i>
            <img src="./assets/images/author.png" alt="profile-avatar" />
            <h3>Morgan Oakley</h3>
        </div>
        <div class="title-area">
            <img src="./assets/images/author.png" alt="profile-avatar" />
            <h4>Hi there,</h4>
            <h2>Morgan Oakley (@morgan)</h2>
        </div>
        <div class="buttons-area">
            <button class="new">New</button>
            <button class="upload">Upload</button>
            <button class="share">Share</button>
        </div>
      </header>
      <main></main>
    </div>
  </body>
</html>
