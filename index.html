<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSS Style -->
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css"
    />
    <title>Admin Dashboard</title>
  </head>
  <body>
    <div class="main-layout">
      <nav class="sidebar">
        <div class="nav-gird">
          <div class="dash-icon">
            <i class="mdi mdi-view-dashboard"></i>
          </div>
          <div class="dash-titles">
            <p>Dashboard</p>
          </div>

          <div class="pages-icons">
            <div>
              <i class="mdi mdi-home"></i>
              <i class="mdi mdi-card-account-details-outline"></i>
              <i class="mdi mdi-message"></i>
              <i class="mdi mdi-clock-time-three"></i>
              <i class="mdi mdi-note-multiple"></i>
              <i class="mdi mdi-account-group"></i>
            </div>
          </div>
          <div class="pages-titles">
            <p>Home</p>
            <p>Profile</p>
            <p>Messages</p>
            <p>History</p>
            <p>Tasks</p>
            <p>communities</p>
          </div>
          <div class="manage-icons">
            <div>
              <i class="mdi mdi-cog" style="font-size: 24px"></i>
              <i class="mdi mdi-help-box" style="font-size: 24px"></i>
              <i class="mdi mdi-shield-check"></i>
            </div>
          </div>
          <div class="manage-titles">
            <p>Settings</p>
             <p>Support</p>
             <p>Privacy</p>
          </div>
        </div>
      </nav>
      <header></header>
      <main></main>
    </div>
  </body>
</html>
